name: "Update Bundled PBI Visuals"
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update-libs:
    name: "Update Bundled PBI Visuals"
    runs-on: "ubuntu-latest"
    env:
      BRANCH: ""
      PBIFUNVER: ""
      PBISPCVER: ""
      PBIDEPS: ""
      PBIPINS: ""

    steps:
    - uses: actions/checkout@v7

    # npm before 11.12 rewrites the lockfile, dropping its libc fields
    - name: Setup Node 24
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Configure Git
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        BRANCH=update-libs-$(echo $RANDOM | md5sum | head -c 10; echo)
        echo "BRANCH=$BRANCH" >> $GITHUB_ENV
        git checkout -b $BRANCH

    - name: Bundle Visuals
      run: |
        specs=()
        for dependency in powerbi-visuals-core:PowerBI-Visuals-Core powerbi-spc:PowerBI-SPC powerbi-funnels:PowerBI-Funnels; do
          repo=AUS-DOH-Safety-and-Quality/${dependency#*:}
          sha=$(git ls-remote https://github.com/$repo refs/heads/main | cut -c1-7)
          specs+=("${dependency%%:*}@github:$repo#$sha")
        done
        # Naming the specs re-resolves them; npm 10 keeps a git dependency's locked commit when only package.json changes
        npm install "${specs[@]}"
        npm run bundle
      working-directory: 'inst/bundle'

    - name: Commit funnel changes
      run: |
        if [[ -n "$(git status inst/htmlwidgets/lib/PBIFUN -s)" ]]; then
          PBIFUNVER=$(jq '.visual.version' inst/bundle/node_modules/powerbi-funnels/pbiviz.json | sed 's/"//g')
          echo "PBIFUNVER=$PBIFUNVER" >> $GITHUB_ENV
          sed -i "/- name: PBIFUN/{n;s/version: .*/version: $PBIFUNVER/;}" inst/htmlwidgets/funnel.yaml
          git add inst/htmlwidgets/lib/PBIFUN inst/htmlwidgets/funnel.yaml
          git commit -m "Update PBIFUN library to version $PBIFUNVER"
        fi

    - name: Commit SPC changes
      run: |
        if [[ -n "$(git status inst/htmlwidgets/lib/PBISPC -s)" ]]; then
          PBISPCVER=$(jq '.visual.version' inst/bundle/node_modules/powerbi-spc/pbiviz.json | sed 's/"//g')
          echo "PBISPCVER=$PBISPCVER" >> $GITHUB_ENV
          sed -i "/- name: PBISPC/{n;s/version: .*/version: $PBISPCVER/;}" inst/htmlwidgets/spc.yaml
          git add inst/htmlwidgets/lib/PBISPC inst/htmlwidgets/spc.yaml
          git commit -m "Update PBISPC library to version $PBISPCVER"
        fi

    - name: Commit dependency changes
      run: |
        if [[ -n "$(git status inst/htmlwidgets/lib/UTILS inst/js -s)" ]]; then
          echo "PBIDEPS=true" >> $GITHUB_ENV
          git add inst/htmlwidgets/lib/UTILS inst/js
          git commit -m "Update visual dependencies"
        fi

    - name: Commit bundle pins
      run: |
        if [[ -n "$(git status inst/bundle/package.json inst/bundle/package-lock.json -s)" ]]; then
          echo "PBIPINS=true" >> $GITHUB_ENV
          git add inst/bundle/package.json inst/bundle/package-lock.json
          git commit -m "Pin bundled repos"
        fi

    - name: Generate PR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: env.PBIFUNVER != '' || env.PBISPCVER != '' || env.PBIDEPS != '' || env.PBIPINS != ''
      run: |
        # Generate PR Title
        PARTS=()
        if [[ -n "${{ env.PBISPCVER }}" ]]; then
          PARTS+=("PBISPC to ${{ env.PBISPCVER }}")
        fi
        if [[ -n "${{ env.PBIFUNVER }}" ]]; then
          PARTS+=("PBIFUN to ${{ env.PBIFUNVER }}")
        fi
        if [[ -n "${{ env.PBIDEPS }}" ]]; then
          PARTS+=("Visual dependencies")
        fi
        if [[ -n "${{ env.PBIPINS }}" ]]; then
          PARTS+=("Bundle pins")
        fi
        TITLE="Update Bundled Lib(s): ${PARTS[0]}"
        for part in "${PARTS[@]:1}"; do
          TITLE+=", $part"
        done

        # Increment package version when the bundled libs change
        if [[ -n "${{ env.PBISPCVER }}${{ env.PBIFUNVER }}${{ env.PBIDEPS }}" ]]; then
          perl -i -pe 's/^Version:\s*(\d+)\.(\d+)\.(\d+)/"Version: $1.$2.".($3+1)/e' DESCRIPTION
          git add DESCRIPTION
          git commit -m "Increment package version"
        fi

        git push --set-upstream origin ${{ env.BRANCH }}
        gh pr create \
          --title "$TITLE" \
          --body "This PR was automatically created by GitHub Actions." \
          --base main \
          --head ${{ env.BRANCH }}
      shell: bash
